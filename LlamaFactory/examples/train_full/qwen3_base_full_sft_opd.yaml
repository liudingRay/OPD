### model
model_name_or_path: ../model/Qwen3-1.7B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: fa2
# The installed liger-kernel imports a newer Transformers-only HybridCache.
# It is an optional acceleration and is not required for Qwen3 SFT.
enable_liger_kernel: false

### dataset
dataset: OpenThought3-4B
template: qwen3
enable_thinking: true
cutoff_len: 14336
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: ../model/Qwen3-1.7B-SFT-OpenThought3-4B
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: false
# Keep optimizer, scheduler, RNG, and trainer state in checkpoint-* so a
# walltime-interrupted SFT job can resume without restarting its schedule.
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100
